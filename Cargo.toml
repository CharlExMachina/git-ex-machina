[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
gxm-core = { path = "crates/gxm-core" }
gxm-world = { path = "crates/gxm-world" }

# Rune is pre-release and doesn't take pull requests. Pin a `dev` rev (never rewritten) and bump it
# in its own PR that re-runs every journey and golden. The four patches below must come from the
# same rev: they are the `[patch.crates-io]` table in Rune's root Cargo.toml.
rune = { git = "https://github.com/anomalyco/rune", rev = "f3461ea8fc68a17b4ce653d49b19c9b6e65f0749", version = "0.0.1" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "f3461ea8fc68a17b4ce653d49b19c9b6e65f0749", version = "0.0.1" }

jiff = { version = "0.2", default-features = false, features = ["std", "alloc", "serde", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
# HTTPS to the providers' APIs: rustls on ring, verified by the platform's trust store (webpki-roots
# is CDLA-licensed, which deny.toml doesn't allow).
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier"] }
# Secrets for Actions, Dependabot and codespaces are sealed (libsodium's sealed box) with the
# repository's public key before they're sent, as GitHub requires.
crypto_box = { version = "0.9", features = ["seal"] }
base64 = "0.22"
# Tokens in the macOS Keychain and the Linux Secret Service (over zbus, no libdbus).
keyring = { version = "3", default-features = false, features = ["apple-native", "async-secret-service", "async-io", "crypto-rust"] }

[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "f3461ea8fc68a17b4ce653d49b19c9b6e65f0749" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "f3461ea8fc68a17b4ce653d49b19c9b6e65f0749" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "f3461ea8fc68a17b4ce653d49b19c9b6e65f0749" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "f3461ea8fc68a17b4ce653d49b19c9b6e65f0749" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
# Weeds we never let take root. Tests may unwrap (see clippy.toml).
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "warn"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_methods = "deny"
await_holding_lock = "deny"
let_underscore_must_use = "deny"
large_futures = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"

# Workspace crates keep line tables only: full debug info balloons test builds with Rune.
[profile.dev]
debug = "line-tables-only"

# Dependencies (wgpu, Taffy, Parley) are optimised even in debug so headless journeys and proof
# videos render at a usable speed. Our own crates stay unoptimised for fast rebuilds.
[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.release]
codegen-units = 16
incremental = true
