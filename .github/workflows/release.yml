name: release

# A tag `vX.Y.Z` releases that version, and nothing else releases anything. Make one either way:
#   - push it (`git tag v0.1.6 && git push origin v0.1.6`, or Tag a release in git-ex-machina), or
#   - on GitHub: Actions → release → Run workflow, with the version. The tag is made on main's
#     newest commit, and only once the release is ready.
# The version comes from the tag: the builds write it into Cargo.toml, so nothing is bumped by
# hand. The notes are the tag's message when it was pushed annotated with one, or else the pull
# requests merged since the last release (`cargo xtask notes`); edit them on the release's page
# afterwards if you like, and the app shows the edited ones.
#
# The Linux AppImage is built and tried (`cargo xtask appimage`: it must extract, hold what it
# should, and start), and so is the macOS disk image (`cargo xtask macapp`: signed with the
# Developer ID, notarized by Apple, accepted by Gatekeeper, and it starts). Only then are both
# published, together, as a GitHub release: the apps update themselves from the latest release,
# so one is never seen without its files. If a build or try fails, nothing is published, and a
# Run workflow release makes no tag: fix it on main, then run it again (or move a pushed tag to
# the fix, or tag the next patch version).
#
# The apps update themselves from the latest release (crates/gxm-core/src/update.rs), looking for
# `git-ex-machina-<arch>.AppImage` and the SHA-256 GitHub keeps for it, and show its notes when
# they offer the restart.
#
# Signing and notarizing need these repository secrets (Settings → Secrets and variables →
# Actions):
#   MACOS_CERT_P12        the "Developer ID Application" certificate and its private key, exported
#                         from Keychain Access as a .p12, then base64-encoded
#   MACOS_CERT_PASSWORD   the password the .p12 was exported with
#   APPLE_API_KEY_P8      the App Store Connect API key (Developer access): the .p8 file's text
#   APPLE_API_KEY_ID      that key's Key ID
#   APPLE_API_ISSUER_ID   the Issuer ID above App Store Connect's keys table
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, as in 0.1.6 (tagged v0.1.6 on main)"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CI: "true"

jobs:
  tag:
    # Which tag this releases, checked before anything is built.
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = push ]; then
            tag="$GITHUB_REF_NAME"
          else
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Releases are made from main: run the workflow on main."
              exit 1
            fi
            tag="v${VERSION#v}"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "::error::$tag is already tagged: release the next version."
              exit 1
            fi
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$tag isn't a release tag: release a version X.Y.Z, as in 0.1.6."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  appimage:
    # The oldest Ubuntu GitHub hosts: the binary needs only the glibc it was built against
    # (2.35), so the AppImage runs on any distribution since.
    needs: tag
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Every release's tag and the changes since the last one, for the notes.
          fetch-depth: 0
      - name: The tag, as it was pushed
        if: github.event_name == 'push'
        # checkout makes the tag it was started by a lightweight one, which has no message.
        run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: Toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-release
      - name: cargo xtask appimage
        run: cargo xtask appimage --tag "$TAG"
      - name: The release's notes
        # Here, where xtask is built already.
        run: |
          mkdir -p target/notes
          cargo xtask notes "$TAG" > target/notes/notes.md
          cat target/notes/notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: target/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: target/notes/notes.md
          if-no-files-found: error
          retention-days: 30

  macos:
    # GitHub's macOS runners are Apple Silicon, so this is the aarch64 disk image. macOS 26's
    # image has the Xcode whose actool compiles the Icon Composer icon (assets/macos/AppIcon.icon).
    needs: tag
    runs-on: macos-26
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-release
      - name: The signing certificate, in a keychain of its own
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          # codesign may use the key without a prompt nobody is there to answer.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
      - name: The notarization key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          echo "GXM_NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
      - name: cargo xtask macapp
        env:
          GXM_NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          GXM_NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: cargo xtask macapp --tag "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: macapp
          path: target/macapp/*.dmg
          if-no-files-found: error
          retention-days: 30
      - name: Forget the keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8"

  publish:
    # Only once every platform's build was built and tried.
    needs: [tag, appimage, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          # A pushed tag is there already. Run workflow's is made now, on the commit it built, with
          # this workflow's token, so making it doesn't start this workflow again.
          if [ "$GITHUB_EVENT_NAME" = push ]; then made=(--verify-tag); else made=(--target "$GITHUB_SHA"); fi
          gh release create "$TAG" dist/*.AppImage dist/*.dmg \
            --title "git-ex-machina ${TAG#v}" \
            --notes-file dist/notes.md \
            "${made[@]}"
