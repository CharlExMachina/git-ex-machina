name: proof

# A PR that touches what people see says how it was proven (CLAUDE.md, "Pull requests").
# `cargo xtask pr open` runs this same check before the PR exists. It's a workflow of its own so
# that editing the PR's body re-runs it, and nothing else; the body is read live, not from the
# event, so a re-run sees the latest edit too.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  CI: "true"

jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
        with:
          # ci.yml's verify job builds everything xtask needs, on main too, and saves it there.
          shared-key: linux-debug
          save-if: false
      - name: The PR body carries proof
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/body.md"
          cargo xtask pr check "$RUNNER_TEMP/body.md" --base "$BASE"
