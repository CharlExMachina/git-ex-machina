# cargo deny check: licenses, advisories, duplicate and unknown sources.
[graph]
all-features = false

[advisories]
yanked = "deny"

[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "OFL-1.1", "BSL-1.0", "CC0-1.0", "0BSD",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Rune is a git dependency by design (pre-release, pinned rev).
allow-git = ["https://github.com/anomalyco/rune"]
