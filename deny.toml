# cargo deny check: licenses, advisories, duplicate and unknown sources.
[graph]
all-features = false
# The platforms the app ships on. (ureq's platform verifier takes CDLA-licensed root
# certificates only on wasm32, which isn't one of them.)
targets = [
  "aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
]

[advisories]
yanked = "deny"
# Flag unmaintained crates we depend on ourselves. Ones deep in a dependency's tree (Rune's
# Linux accessibility stack pulls in zvariant) are for that dependency to replace; security
# vulnerabilities fail wherever they are.
unmaintained = "workspace"

[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "OFL-1.1", "BSL-1.0", "CC0-1.0", "0BSD",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Our crates depend on each other by path and are never published, so a path without a
# version isn't a wildcard. A registry dependency still needs one.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Rune is a git dependency by design (pre-release, pinned rev).
allow-git = ["https://github.com/anomalyco/rune"]
